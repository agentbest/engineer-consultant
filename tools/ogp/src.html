<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<!-- OGP画像（1200×630）の原本。再出力手順は同じフォルダの README.md -->
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{position:relative;box-sizing:border-box;background:#F6F8F7;color:#1B2430;
    font-family:"Yu Gothic","YuGothic","Meiryo",sans-serif;
    background-image:radial-gradient(ellipse 70% 90% at 100% 0%,#DEF4EC 0%,#F6F8F7 70%);
    border-left:14px solid #0FA774}
  .in{position:absolute;left:84px;right:84px;top:0;bottom:130px;display:flex;flex-direction:column;justify-content:center}
  .eye{margin:0 0 30px;font-size:24px;font-weight:700;letter-spacing:.08em;color:#0FA774;display:flex;align-items:center;gap:16px}
  .eye::before{content:"";width:40px;height:3px;background:#0FA774;display:block}
  h1{margin:0;font-family:"Yu Gothic","YuGothic","Meiryo",sans-serif;font-weight:700;font-size:76px;line-height:1.3;letter-spacing:.02em}
  h1 .hl{color:#0C8E62}
  .sub{margin:30px 0 0;font-size:25px;color:#556270;letter-spacing:.04em}
  .foot{position:absolute;left:84px;right:84px;bottom:46px;display:flex;align-items:center;justify-content:space-between;
    border-top:1px solid rgba(27,36,48,.14);padding-top:26px}
  .foot img{height:46px;display:block}
  .foot span{font-family:Consolas,monospace;font-size:21px;color:#556270;letter-spacing:.03em}
</style></head>
<body>
  <div class="in">
    <p class="eye">20〜30代前半のエンジニアへ ・ コンサル未経験OK</p>
    <h1>エンジニアの経験は、<br>コンサルで<span class="hl">武器</span>になる。</h1>
    <p class="sub">エンジニア出身のコンサル転職支援</p>
  </div>
  <div class="foot"><img src="../../logo.png" alt="エージェントベスト"><span>eng.agent-best.net</span></div>
</body></html>
